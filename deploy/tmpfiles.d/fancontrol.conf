# Creates the API socket's directory at boot, independently of the service.
#
# Deliberately NOT the unit's RuntimeDirectory=: systemd deletes and recreates that on
# every service restart, which gives it a new inode and silently breaks a bind mount of it
# into a container (the container keeps looking at the old, now empty, directory). Created
# here it stays put across daemon restarts, and it exists before any container starts.
d /run/fancontrol 0755 root root -
