# vigild configuration for orion. Installed as /etc/vigil/vigild.toml.
# Validate after editing, without touching any fan:
#   /opt/vigil/vigild --config /etc/vigil/vigild.toml --check

poll_interval_secs = 2
# If the control loop doesn't complete a poll within this window, every channel is released
# back to BIOS control. Must be at least twice poll_interval_secs.
deadman_timeout_secs = 30
# How often the hwmon tree is re-scanned, so a drive that resets or is hot-swapped is
# picked back up without a restart.
sensor_rescan_interval_secs = 30

[api]
# Unix socket only, never a network port. Try it from the host with:
#   curl --unix-socket /run/vigil/vigild.sock http://localhost/status
#   curl -N --unix-socket /run/vigil/vigild.sock http://localhost/events
socket_path = "/run/vigil/vigild.sock"
socket_mode = "0660"
# For a consumer in an UNPRIVILEGED LXC: bind-mount the directory (not the socket file,
# which is recreated on every start) into the container,
#   pct set <vmid> -mp0 /run/vigil,mp=/mnt/vigil
# and give the socket to the host uid/gid the container maps to.
#
# On orion the consumer is vigil-web in CT 203: uid 100000 is the container's root, and
# gid 102000 is its `vigil` group (gid 2000 inside), which vigil-web runs as.
# Without these the socket is root:root 0660 and vigil-web can't open it, while every
# check run from the host as root still works.
socket_uid = 100000
socket_gid = 102000
max_clients = 16

[gpu]
enabled = true
min_read_interval_secs = 6
timeout_secs = 5

[hba]
enabled = true
device_path = "/dev/mpt3ctl"
ioc_number = 0

[drive_health]
enabled = true
poll_interval_secs = 900
timeout_secs = 60

# Zones group sensors by the airflow they sit in, not by sensor category. The case has two
# compartments:
#
#  - Bottom: the PSU and 12 drive bays, 11 filled. Both drive-cage fans share one header
#    and exhaust, but the two stacks don't share a path to them. The fans sit behind the
#    8-bay stack (right), a straight run. The PSU sits behind the 4-bay stack (left), so
#    its air turns around the PSU face first, and extra duty mostly goes down the easy
#    path into the 8-bay. The hottest drive in either stack still sets the speed.
#  - Top: motherboard, CPU, GPU, the LSI HBA and the two Samsung 870 EVO SSDs, bolted to
#    the case wall. One intake blows across the SSD/LSI/GPU side, another onto the CPU.
#    lsi-cooling is not a case fan: it is on the HBA's own shroud.
#
# Zones name bays by port: "port:" plus the drive's /dev/disk/by-path name, which carries
# the controller's PCI address and the port or phy on it. A port stays with the bay, so a
# swapped disk lands in the right zone with no config change; a drive's WWN (its sensor
# id, "drive:naa...") follows the disk and is what history and SMART are keyed on.
# `ls -l /dev/disk/by-path/` on the host lists them. 0000:03:00.0 is the LSI SAS9300-8i,
# 0000:01:00.1 the motherboard SATA controller; its ata numbers are the board's own port
# numbers, not probe order (ata-4 exists with nothing attached).

# The LSI's eight phys: 8-bay 1-8 are phy0-phy7. The void pool.
[[zones]]
id = "eight-bay"
sensor_ids = ["port:pci-0000:03:00.0-sas-*"]

# 4-bay 1 is ata-3 (scratch, SMR), 4-bay 3 is ata-6 and 4-bay 4 is ata-5 (the hot spares).
# 4-bay 2 would be ata-4, which has nothing attached; add it here if a disk goes in, since
# a port named here with no drive on it counts as an unreadable sensor.
[[zones]]
id = "four-bay"
sensor_ids = ["port:pci-0000:01:00.1-ata-3", "port:pci-0000:01:00.1-ata-6", "port:pci-0000:01:00.1-ata-5"]

# The two rpool SSDs on ata-1 and ata-2, bolted to the top compartment's case wall.
[[zones]]
id = "component-bay"
sensor_ids = ["hba", "port:pci-0000:01:00.1-ata-1", "port:pci-0000:01:00.1-ata-2"]

# Header mapping verified on this board (ASRock B550 Pro4, NCT6798D) by walking each
# channel in manual mode and watching which tach responds. pwm6 is unwired.

[[channels]]
id = "drive-cage"
chip_name = "nct6798"
index = 1
minimum_duty_percent = 30

[[channels]]
id = "cpu-cooler-front"
chip_name = "nct6798"
index = 2
minimum_duty_percent = 30

[[channels]]
id = "cpu-cooler-rear"
chip_name = "nct6798"
index = 3
minimum_duty_percent = 30

[[channels]]
id = "intake-cpu"
chip_name = "nct6798"
index = 4
minimum_duty_percent = 30

[[channels]]
id = "intake-gpu-lsi"
chip_name = "nct6798"
index = 5
minimum_duty_percent = 30

[[channels]]
id = "lsi-cooling"
chip_name = "nct6798"
index = 7
minimum_duty_percent = 30

# points are [temperature_celsius, duty_percent], ascending. The hottest of sensor_ids
# drives the fan; "drive:*" means every drive. fail_safe_duty_percent applies when every
# sensor is unreadable, and is the minimum when only some explicitly named one is.

[[curves]]
fan_channel_id = "cpu-cooler-front"
sensor_ids = ["cpu"]
points = [[30, 30], [45, 45], [60, 70], [75, 100]]
fail_safe_duty_percent = 100

[[curves]]
fan_channel_id = "cpu-cooler-rear"
sensor_ids = ["cpu"]
points = [[30, 30], [45, 45], [60, 70], [75, 100]]
fail_safe_duty_percent = 100

[[curves]]
fan_channel_id = "intake-cpu"
sensor_ids = ["cpu"]
points = [[30, 30], [45, 40], [60, 60], [75, 90]]
fail_safe_duty_percent = 100

[[curves]]
fan_channel_id = "intake-gpu-lsi"
zones = ["component-bay"]
sensor_ids = ["gpu"]
points = [[40, 30], [55, 45], [70, 70], [85, 100]]
fail_safe_duty_percent = 80

[[curves]]
fan_channel_id = "lsi-cooling"
sensor_ids = ["hba"]
points = [[45, 35], [55, 50], [65, 75], [75, 100]]
fail_safe_duty_percent = 80

# The hottest of all eleven HDDs, both stacks, sets the speed.
[[curves]]
fan_channel_id = "drive-cage"
zones = ["eight-bay", "four-bay"]
points = [[28, 30], [33, 45], [38, 65], [43, 90], [48, 100]]
fail_safe_duty_percent = 80
