<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
			Applied before first paint so a stored theme choice never flashes the other one. It
			lives here rather than in a component because that is the only way it can carry a CSP
			nonce (docs/SECURITY.md §8): SvelteKit substitutes %sveltekit.nonce% with the
			per-response nonce its Content-Security-Policy header allows.
			It reads one key of localStorage and writes one data attribute. Nothing from outside
			reaches it.
		-->
		<script nonce="%sveltekit.nonce%">
			try {
				var stored = localStorage.getItem('theme');
				if (stored === 'light' || stored === 'dark') document.documentElement.dataset.theme = stored;
			} catch (error) {
				/* private mode, or site data blocked: the OS preference decides instead */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
