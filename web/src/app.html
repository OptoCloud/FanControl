<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
			Applied before first paint so a stored theme choice never flashes the other one, which
			is why it is a plain blocking script here rather than code in a component. A file
			rather than inline: the page's CSP (docs/SECURITY.md §8) allows scripts from 'self',
			and an inline one would need its hash kept in step by hand.
		-->
		<script src="%sveltekit.assets%/theme.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
