# Postgres for local development only (the real deployment runs Postgres inside the LXC).
#   docker compose -f docker-compose.dev.yml up -d
#   DATABASE_URL=postgres://vigil:vigil@127.0.0.1:5433/vigil
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - vigil-dev-pg:/var/lib/postgresql/data

volumes:
  vigil-dev-pg:
