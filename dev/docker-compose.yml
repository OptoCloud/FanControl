# Postgres for local development only (production uses the shared Postgres in CT 300).
#   docker compose -f dev/docker-compose.yml up -d
#   DATABASE_URL=postgres://vigil:vigil@127.0.0.1:5433/vigil
services:
  postgres:
    # The same Postgres and TimescaleDB versions as CT 300; the image creates the extension itself.
    image: timescale/timescaledb:2.30.2-pg18
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      # Postgres 18 images keep their data one level up, under /var/lib/postgresql/18.
      - vigil-dev-pg18:/var/lib/postgresql

volumes:
  vigil-dev-pg18:
