[package]
name = "vigil-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "vigil's orchestrator: reads vigild and the UPS, records history, raises alerts, streams the live state to vigil-web"
publish.workspace = true

[dependencies]
vigil-protocol = { path = "../protocol" }
vigil-logging = { path = "../logging" }
serde_json = "1"
# The blocking client: vigil-core is plain threads and channels, like vigild. It runs a small
# tokio runtime inside, which never leaks into this code.
postgres = "0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-journald = "0.3.2"
tokio-stream = "0.1.19"
async-stream = "0.3.6"
tower = { version = "0.5.3", features = ["limit", "load-shed"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
