[package]
name = "vigild"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "vigil's hardware daemon: temperatures, drive health and fan control"
publish.workspace = true

[dependencies]
vigil-protocol = { path = "../protocol" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
