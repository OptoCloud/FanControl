[package]
name = "vigild"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "vigil's hardware daemon: temperatures, drive health and fan control"
publish.workspace = true

[dependencies]
vigil-protocol = { path = "../protocol" }
vigil-logging = { path = "../logging" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "macros"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-journald = "0.3.2"
tokio-stream = "0.1.19"
async-stream = "0.3.6"
tower = { version = "0.5.3", features = ["limit", "load-shed"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

# Linux-only: there is no systemd to notify anywhere else, and the daemon is unit-tested on
# Windows (ADR-005).
[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.5"
